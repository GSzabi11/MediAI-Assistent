spring.application.name=mediai
# Közös beállítások a repó gyökerében lévő .env-ből (sablon: .env.example). A working directory a
# backend/ (mvnw spring-boot:run), ezért ../.env; a valódi környezeti változó felülírja.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:mydatabase}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Betegdokumentumok helye (a working directoryhoz relatív); a data/ gitignore-olva van
mediai.storage.documents-dir=data/documents
# Hangprofil-minták és felvételek (biometrikus / betegadat, gitignore-olt data/ alatt)
mediai.storage.voice-dir=data/voice
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Python AI-szolgáltatás (dokumentum-feldolgozás, docs/document-processing.md).
# A token a két szolgáltatás közös titka (mindkét irányban), környezeti változóból vagy a .env-ből:
# nincs alapértelmezés — ha nincs beállítva, az alkalmazás nem indul (fail-closed).
mediai.ai-service.url=${MEDIAI_AI_SERVICE_URL:http://localhost:8001}
mediai.ai-service.token=${MEDIAI_AI_TOKEN:}
210# Erre az alapcímre hív vissza a Python (…/api/documents/{id}/processing-result)
mediai.ai-service.callback-base-url=${MEDIAI_CALLBACK_BASE_URL:http://localhost:8080}
# Python hangszolgáltatás (ai-service/voice/service.py, docs/voice-module.md) — ugyanaz a belső token
mediai.voice-service.url=${MEDIAI_VOICE_SERVICE_URL:http://localhost:8002}
# A felvétel asr_model alapértéke (a Python a callbackben a ténylegesen használtat adja meg)
mediai.voice-service.asr-model=${ASR_MODEL:large-v3}
