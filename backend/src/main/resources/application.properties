spring.application.name=mediai
spring.datasource.url=jdbc:postgresql://localhost:5433/mydatabase
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Betegdokumentumok helye (a working directoryhoz relatív); a data/ gitignore-olva van
mediai.storage.documents-dir=data/documents
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB