spring.application.name=mediai
spring.datasource.url=jdbc:postgresql://localhost:5433/mydatabase
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Betegdokumentumok helye (a working directoryhoz relatív); a data/ gitignore-olva van
mediai.storage.documents-dir=data/documents
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Python AI-szolgáltatás (dokumentum-feldolgozás, docs/document-processing.md).
# A token a két szolgáltatás közös titka (mindkét irányban): élesben környezeti változóból.
mediai.ai-service.url=${MEDIAI_AI_SERVICE_URL:http://localhost:8001}
mediai.ai-service.token=${MEDIAI_AI_TOKEN:dev-only-change-me}
# Erre az alapcímre hív vissza a Python (…/api/documents/{id}/processing-result)
mediai.ai-service.callback-base-url=${MEDIAI_CALLBACK_BASE_URL:http://localhost:8080}
